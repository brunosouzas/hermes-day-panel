[project]
name = "hermes-day-panel"
version = "0.1.0"
description = "Hermes Agent plugin: a Today page in Hermes Desktop built from pluggable, read-only sources"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Nothing is installed into Hermes: the plugin uses the standard library plus core's hermes_yaml
# (ruamel.yaml, a Hermes dependency) to read the sources file.
dependencies = []

[dependency-groups]
# ruamel.yaml backs the test stand-in for hermes_yaml; pyyaml only writes test fixtures.
dev = ["pytest>=8,<10", "ruamel.yaml>=0.18,<0.19", "pyyaml>=6", "fastapi>=0.110", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: the repository root is the plugin package and must not be collected as one.
addopts = "-p no:cacheprovider --import-mode=importlib"
